<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoons Sales Notice - 메인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background: #0b1329; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hover-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-card:hover { transform: translateY(-8px); border-color: #3b82f6; box-shadow: 0 20px 30px -10px rgba(59, 130, 246, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <header class="border-b border-slate-800/80 bg-slate-900/60 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl flex items-center justify-center font-black text-xl text-white shadow-lg shadow-blue-500/30">Y</div>
                <div>
                    <h1 class="font-bold text-xl text-white tracking-tight">Yoons Sales Notice</h1>
                    <p class="text-xs text-slate-400">윤선생 영업 실적 모니터링 대시보드</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-20 flex-1 flex flex-col justify-center items-center w-full">
        <div class="text-center mb-12">
            <span class="text-xs font-semibold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-4 py-1.5 rounded-full border border-blue-500/20">Sales Hub</span>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white mt-4 mb-3">본부별 영업 실적 선택</h2>
            <p class="text-slate-400 text-sm max-w-md mx-auto">실시간 실적 데이터를 확인하고자 하는 본부 대시보드를 클릭해 주세요.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-8 w-full">
            <a href="seoulnam.html" class="glass-panel hover-card rounded-2xl p-8 flex flex-col justify-between group">
                <div>
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-400 mb-6 group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-location-dot text-xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">서울남 본부</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">서울남 본부 소속 사업자 및 지점별 상세 영업 실적 리포트</p>
                </div>
                <div class="mt-8 flex items-center text-sm font-semibold text-blue-400 group-hover:text-blue-300">
                    대시보드 보기 <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

            <a href="gyeongginam.html" class="glass-panel hover-card rounded-2xl p-8 flex flex-col justify-between group">
                <div>
                    <div class="w-12 h-12 bg-indigo-500/10 rounded-xl flex items-center justify-center text-indigo-400 mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-map-location-dot text-xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">경기남 본부</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">경기남 본부 소속 사업자 및 지점별 상세 영업 실적 리포트</p>
                </div>
                <div class="mt-8 flex items-center text-sm font-semibold text-indigo-400 group-hover:text-indigo-300">
                    대시보드 보기 <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
        © Yoons Educational Group. All rights reserved.
    </footer>
</body>
</html>
