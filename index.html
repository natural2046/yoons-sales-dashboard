<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoons Sales Notice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card-btn { transition: all 0.2s ease-in-out; }
        .card-btn:hover { transform: translateY(-4px); border-color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-lg text-white">Y</div>
                <span class="font-bold text-lg text-white">Yoons Sales Notice</span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-16 flex-1 flex flex-col justify-center w-full">
        <div class="text-center mb-10">
            <h2 class="text-2xl font-bold text-white mb-2">영업 실적 공지 현황</h2>
            <p class="text-slate-400 text-sm">조회하고자 하는 본부를 선택하세요.</p>
        </div>

        <div class="grid sm:grid-cols-2 gap-6 w-full">
            <a href="seoulnam.html" class="card-btn bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between">
                <div>
                    <div class="text-blue-400 text-2xl mb-4"><i class="fa-solid fa-building"></i></div>
                    <h3 class="text-xl font-bold text-white mb-1">서울남 본부</h3>
                    <p class="text-slate-400 text-xs">서울남 소속 가맹점/센터 실적 조회</p>
                </div>
                <div class="mt-6 text-sm text-blue-400 font-medium">바로가기 →</div>
            </a>

            <a href="gyeongginam.html" class="card-btn bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between">
                <div>
                    <div class="text-indigo-400 text-2xl mb-4"><i class="fa-solid fa-building"></i></div>
                    <h3 class="text-xl font-bold text-white mb-1">경기남 본부</h3>
                    <p class="text-slate-400 text-xs">경기남 소속 가맹점/센터 실적 조회</p>
                </div>
                <div class="mt-6 text-sm text-indigo-400 font-medium">바로가기 →</div>
            </a>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        Yoons Educational Group
    </footer>
</body>
</html>
