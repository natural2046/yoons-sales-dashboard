<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울남 본부 영업 실적</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-btn.active { background-color: #3b82f6; color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="min-h-screen pb-16">
    <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-xl flex items-center justify-center text-slate-300 transition-colors">
                    <i class="fa-solid fa-house text-sm"></i>
                </a>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white">서울남 본부 영업 실적</h1>
                    <p class="text-xs text-slate-400">실시간 영업 실적 리포트</p>
                </div>
            </div>
            <div class="text-xs text-slate-400 bg-slate-800/80 px-3.5 py-1.5 rounded-full border border-slate-700/80 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                실시간 데이터 동기화 완료
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-8">
        <!-- 탭 네비게이션 & 검색창 -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
            <div class="flex bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60 w-full sm:w-auto">
                <button onclick="switchTab('상세_홈')" id="tab-상세_홈" class="tab-btn active px-6 py-2 rounded-lg text-sm transition-all flex-1 sm:flex-none">상세 홈</button>
                <button onclick="switchTab('요약_홈')" id="tab-요약_홈" class="tab-btn px-6 py-2 rounded-lg text-sm text-slate-400 transition-all flex-1 sm:flex-none">요약 홈</button>
                <button onclick="switchTab('기준_홈')" id="tab-기준_홈" class="tab-btn px-6 py-2 rounded-lg text-sm text-slate-400 transition-all flex-1 sm:flex-none">기준 정보</button>
            </div>
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" onkeyup="filterTable()" placeholder="사업자, 지점명, 데이터 검색..." class="w-full bg-slate-800/90 border border-slate-700 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-all shadow-inner">
            </div>
        </div>

        <!-- 데이터 테이블 카드 -->
        <div class="glass-card rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-200">
                    <thead class="text-xs font-semibold uppercase bg-slate-800/90 text-slate-400 border-b border-slate-700/80" id="table-head"></thead>
                    <tbody class="divide-y divide-slate-800/60" id="table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let globalData = {};
        const dataFile = './data/seoulnam_data.json';

        async function loadData() {
            try {
                const res = await fetch(dataFile);
                globalData = await res.json();
                switchTab('상세_홈');
            } catch(e) { console.error(e); }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'text-white');
                b.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if(activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-slate-400');
            }
            renderTable(globalData[tab] || []);
        }

        function renderTable(data) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            thead.innerHTML = ''; tbody.innerHTML = '';

            if(!data || !data.length) {
                tbody.innerHTML = '<tr><td class="p-8 text-center text-slate-500">조회할 데이터가 존재하지 않습니다.</td></tr>';
                return;
            }
            
            const headers = Object.keys(data[0]);
            thead.innerHTML = '<tr>' + headers.map(h => `<th class="px-6 py-4 whitespace-nowrap">${h}</th>`).join('') + '</tr>';
            
            tbody.innerHTML = data.map(r => 
                '<tr class="hover:bg-slate-800/50 transition-colors">' + 
                headers.map(h => `<td class="px-6 py-3.5 whitespace-nowrap text-slate-300">${r[h] ?? ''}</td>`).join('') + 
                '</tr>'
            ).join('');
        }

        function filterTable() {
            const q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#table-body tr').forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
