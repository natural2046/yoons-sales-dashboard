<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기남 본부 영업 실적 - Yoons Sales Notice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-btn.active { background-color: #2563eb; color: #ffffff; font-weight: 600; }
        th, td { white-space: nowrap; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-slate-400 hover:text-white mr-2"><i class="fa-solid fa-arrow-left"></i></a>
                <span class="font-bold text-lg text-white">경기남 본부 영업 실적</span>
            </div>
            <div id="update-time" class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                실시간 데이터 동기화
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-6">
        <!-- 탭 및 검색창 -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 w-full sm:w-auto">
                <button onclick="switchTab('상세_홈')" id="tab-상세_홈" class="tab-btn active px-5 py-2 rounded-lg text-sm text-slate-300">상세 홈</button>
                <button onclick="switchTab('요약_홈')" id="tab-요약_홈" class="tab-btn px-5 py-2 rounded-lg text-sm text-slate-400">요약 홈</button>
                <button onclick="switchTab('기준_홈')" id="tab-기준_홈" class="tab-btn px-5 py-2 rounded-lg text-sm text-slate-400">기준 정보</button>
            </div>
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" onkeyup="filterTable()" placeholder="센터명, 사업자, 데이터 검색..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- 실적 표 -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-200">
                    <thead class="text-xs uppercase bg-slate-900/80 text-slate-400 border-b border-slate-700" id="table-head"></thead>
                    <tbody class="divide-y divide-slate-800" id="table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let globalData = {};
        let currentTab = '상세_홈';
        const dataFile = './data/gyeongginam_data.json';

        async function loadData() {
            try {
                const res = await fetch(dataFile);
                globalData = await res.json();
                switchTab('상세_홈');
            } catch(e) { console.error(e); }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'text-white');
                b.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if(activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-slate-400');
            }
            renderTable(globalData[tab] || []);
        }

        function renderTable(data) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            thead.innerHTML = ''; tbody.innerHTML = '';

            if(!data || !data.length) {
                tbody.innerHTML = '<tr><td class="p-8 text-center text-slate-500" colspan="100">데이터가 없습니다.</td></tr>';
                return;
            }

            const headers = Object.keys(data[0]);
            thead.innerHTML = '<tr>' + headers.map(h => `<th class="px-5 py-3.5 font-semibold text-slate-300 bg-slate-900/90">${h}</th>`).join('') + '</tr>';
            
            tbody.innerHTML = data.map(r => 
                '<tr class="hover:bg-slate-700/40 transition-colors">' + 
                headers.map(h => `<td class="px-5 py-3 text-slate-300">${r[h] ?? ''}</td>`).join('') + 
                '</tr>'
            ).join('');
        }

        function filterTable() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            const rawList = globalData[currentTab] || [];
            
            if(!q) {
                renderTable(rawList);
                return;
            }

            const filtered = rawList.filter(row => {
                return Object.values(row).some(val => String(val).toLowerCase().includes(q));
            });
            renderTable(filtered);
        }

        window.onload = loadData;
    </script>
</body>
</html>
